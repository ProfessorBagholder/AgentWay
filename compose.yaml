name: agentway
services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${AGENTWAY_PORT:-8787}:8787"
    volumes:
      - agentway-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
volumes:
  agentway-data:
